  /* 语义别名 —— apply-html-head-contract 需要 */
  --tianjie-background: var(--cream-50);
  --tianjie-foreground: var(--plum-900);
  --tianjie-card: #FFFFFF;
  --tianjie-card-foreground: var(--plum-900);

  --tianjie-popover-foreground: var(--plum-900);
  --tianjie-primary: var(--pink-500);
  --tianjie-primary-foreground: #FFFFFF;
  --tianjie-muted: var(--pink-50);
  --tianjie-muted-foreground: var(--plum-500);
  --tianjie-border: var(--plum-100);
  --tianjie-input: var(--cream-100);
  --tianjie-ring: var(--pink-400);
  --tianjie-radius-sm: 6px;
  --tianjie-radius-md: 14px;
  --tianjie-radius-lg: 20px;

  /* 页面级快捷别名 */
  --bg: var(--tianjie-background);
  --foreground: var(--tianjie-foreground);
  --surface: var(--tianjie-card);
  --surface-2: var(--tianjie-muted);
  --ink: var(--plum-900);
  --ink-2: var(--plum-700);
  --ink-3: var(--plum-500);
  --line: var(--tianjie-border);
  --brand: var(--pink-500);
  --brand-soft: var(--pink-100);
  --brand-ink: #FFFFFF;
  --r-sm: var(--tianjie-radius-sm);
  --r-md: var(--tianjie-radius-md);
  --r-lg: var(--tianjie-radius-lg);
  --r-pill: 999px;
  --shadow-1: 0 2px 8px rgba(74, 63, 69, .05), 0 1px 3px rgba(74, 63, 69, .03);
  --shadow-2: 0 8px 24px -6px rgba(255, 107, 155, .18);
  --shadow-3: 0 18px 44px -12px rgba(74, 63, 69, .18);

  /* 侧边栏渐变 — 紫粉 */
  --sidebar-gradient: linear-gradient(180deg, var(--purple-500) 0%, var(--pink-300) 100%);

  /* 模块情绪色 — 赤橙黄绿青蓝紫粉 */
  --c-home: var(--purple-500);
  --c-diet: var(--green-500);
  --c-skincare: var(--pink-500);
  --c-fitness: var(--orange-500);
  --c-shaping: var(--cyan-500);
  --c-finance: var(--yellow-500);
  --c-stocks: var(--red-500);
  --c-english: var(--blue-500);
  --c-mood: var(--purple-500);

  /* 状态色 */
  --state-success: var(--green-500);
  --state-warning: var(--yellow-500);
  --state-error: #FF7A7A;
  --state-info: var(--blue-500);

  /* 字体 */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "MiSans", system-ui, sans-serif;
}

    <style id="critical-layout">
      *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);min-height:100vh;overscroll-behavior:none;-webkit-overflow-scrolling:touch}
      .app-frame{display:flex;width:100%;max-width:480px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
      .app-sidebar{width:80px;flex-shrink:0;background:linear-gradient(180deg,var(--purple-500) 0%,var(--pink-300) 100%);padding:14px 6px;display:flex;flex-direction:column;gap:10px}
      .sidebar-brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:8px}
      .brand-avatar{width:38px;height:38px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-1)}
      .brand-avatar svg{width:20px;height:20px;color:var(--pink-500)}
      .brand-title{font-size:12px;font-weight:700;color:#fff;text-align:center;word-break:keep-all}
      .brand-subtitle{font-size:10px;color:rgba(255,255,255,.85);text-align:center}
      .sidebar-nav{display:flex;flex-direction:column;gap:6px;flex:1}
      .nav-row{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:rgba(255,255,255,.92);text-decoration:none;transition:background .15s}
      .nav-row[data-active="true"]{background:rgba(255,255,255,.28);color:#fff;font-weight:600}
      .nav-icon{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:var(--module-color,var(--surface))}
      .nav-row[data-active="true"] .nav-icon{background:rgba(255,255,255,.45);color:var(--module-color,var(--surface))}

      .kpi-pill i{font-style:normal}
      .hero-card{background:linear-gradient(135deg,var(--purple-500) 0%,var(--pink-400) 100%);padding:16px 18px;color:#fff;border:none}

      .hero-weather{display:flex;align-items:center;gap:3px;font-size:12px;opacity:.95;flex-shrink:0;padding:5px 9px;background:rgba(255,255,255,.2);border-radius:var(--r-pill)}

      .stat-card:hover{transform:translateY(-2px)}
      .stat-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--stat-soft);color:var(--stat-color)}
      .stat-icon svg{width:14px;height:14px}
      .stat-value{font-size:15px;font-weight:700;color:var(--stat-color);line-height:1.1}

      .activity-item:last-child{border-bottom:none;padding-bottom:0}
      .activity-item:first-child{padding-top:0}
      .activity-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
      .activity-icon svg{width:15px;height:15px}
      .activity-body{flex:1;min-width:0}
      .activity-text{font-size:13px;color:var(--ink);line-height:1.3}
      .activity-time{font-size:11px;color:var(--ink-3);margin-top:2px}
      .todo-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}

      .todo-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--surface)}
      .todo-row.done .todo-check{background:var(--green-500);border-color:var(--green-500);color:#fff}

      .badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:var(--r-pill);font-size:11px;font-weight:500;background:var(--brand-soft);color:var(--brand)}
      .quote-card{background:linear-gradient(135deg,var(--purple-100) 0%,var(--pink-100) 100%);border:1px solid rgba(255,255,255,.6);padding:14px 16px}
      .quote-inline{display:flex;align-items:center;gap:12px}
      .quote-left{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center}
      .quote-body{flex:1;min-width:0}

      .todo-pill.done{opacity:.6}
      .todo-pill .todo-check{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;flex-shrink:0}
      .todo-pill.done .todo-check{background:var(--green-500);border-color:var(--green-500);color:#fff}
    </style>
    <style>
      /* 心情卡片 */
      .mood-card .mood-subtitle{font-size:12px;color:var(--ink-3);margin-bottom:12px;margin-top:-4px}
      .mood-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
      .mood-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px;border-radius:var(--r-md);background:var(--surface-2);border:2px solid transparent;transition:transform .15s,border-color .15s,background .15s;cursor:pointer;font-family:inherit}
      .mood-btn:hover{transform:translateY(-1px)}
      .mood-btn.selected{border-color:var(--c-mood);background:var(--purple-100);transform:scale(1.03)}
      .mood-emoji{font-size:24px;line-height:1}
      .mood-name{font-size:11px;color:var(--ink-2)}
      .mood-btn.selected .mood-name{color:var(--c-mood);font-weight:600}
      .mood-note-wrap{margin-top:12px}
      .mood-note{width:100%;font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;resize:vertical;outline:none;transition:border-color .15s}
      .mood-note:focus{border-color:var(--c-mood)}

      /* 语录按钮组 */
      .quote-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
      .quote-speak{cursor:pointer;opacity:.6;transition:opacity .15s,color .15s}
      .quote-speak:hover{opacity:1}
      .quote-speak.playing{color:var(--pink-500);opacity:1}
      .quote-refresh{cursor:pointer;opacity:.6;transition:opacity .15s}
      .quote-refresh:hover{opacity:1}

      /* contenteditable 占位符 */
      [contenteditable]{outline:none}
      [contenteditable][data-placeholder]:empty:before{content:attr(data-placeholder);color:rgba(255,255,255,.7);font-style:italic}

      /* 待办交互 */
      .todo-pill{cursor:pointer;transition:opacity .15s}
      .todo-pill .todo-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .todo-pill.done .todo-text{text-decoration:line-through;color:var(--ink-3)}
      .todo-add-wrap{margin-top:10px}
      .todo-add-input{width:100%;font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r-pill);padding:8px 14px;outline:none;transition:border-color .15s,border-style .15s}
      .todo-add-input:focus{border-color:var(--green-500);border-style:solid}
      .todo-del{cursor:pointer;color:var(--ink-3);opacity:.4;transition:opacity .15s,color .15s;flex-shrink:0}
      .todo-pill:hover .todo-del{opacity:.8}
      .todo-del:hover{color:var(--red-500);opacity:1}

      /* 空动态 */
      .activity-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px 8px;text-align:center}
      .activity-empty-text{font-size:12px;color:var(--ink-3)}
    </style>
<script>
(function () {
  /* ===== 数据持久化（按日期隔离） ===== */
  var TODAY = new Date().toISOString().slice(0, 10);
  var KEY = 'tj_home_' + TODAY;
  function loadData() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function saveData(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
  var DATA = loadData();

  /* ===== 励志语录库 ===== */
  var QUOTES = [
    { en: "Be the energy you want to attract.", zh: "成为你想吸引的那种能量。" },
    { en: "You are capable of more than you know.", zh: "你的能力超乎你的想象。" },
    { en: "Every day is a second chance.", zh: "每一天都是一次新的机会。" },
    { en: "Dream big, work hard, stay focused.", zh: "勇敢梦想，努力前行，保持专注。" },
    { en: "Make today so awesome that yesterday gets jealous.", zh: "让今天精彩到让昨天都嫉妒。" },
    { en: "Believe you can and you're halfway there.", zh: "相信你可以，你就已经成功了一半。" },
    { en: "The best time for new beginnings is now.", zh: "重新开始的最好时机就是现在。" },
    { en: "Your only limit is you.", zh: "你唯一的限制就是你自己。" },
    { en: "Progress, not perfection.", zh: "追求进步，而非完美。" },
    { en: "You are stronger than you think.", zh: "你比想象中更坚强。" },
    { en: "Small steps every day add up.", zh: "每天一小步，未来一大步。" },
    { en: "Choose joy today.", zh: "今天，选择快乐。" }
  ];

  /* ===== 默认待办（首次使用） ===== */
  var DEFAULT_TODOS = [
    { text: "晨间护肤", done: false },
    { text: "早餐记录", done: false },
    { text: "喝水 8 杯", done: false },
    { text: "晚间瑜伽", done: false },
    { text: "背 10 词", done: false }
  ];

  var WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  function $(id) { return document.getElementById(id); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ===== 问候语 + 日期 ===== */
  function renderGreeting() {
    var now = new Date();
    var h = now.getHours();
    var g = '晚安，甜姐';
    if (h >= 5 && h < 11) g = '早安，甜姐';
    else if (h >= 11 && h < 18) g = '午安，甜姐';
    var m = now.getMonth() + 1, d = now.getDate();
    var dateStr = m + '月' + d + '日 ' + WEEK[now.getDay()];
    $('hero-greeting').textContent = g + ' · ' + dateStr;
    var sd = $('sidebar-date');
    if (sd) sd.textContent = now.getFullYear() + '年' + String(m).padStart(2, '0') + '月' + String(d).padStart(2, '0') + '日 ' + WEEK[now.getDay()];
  }

  /* ===== Motto（小目标） ===== */
  function bindMotto() {
    var el = $('hero-motto');
    if (DATA.motto) { el.textContent = DATA.motto; }
    el.addEventListener('blur', function () {
      DATA.motto = el.textContent.trim();
      saveData(DATA);
    });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    });
  }

  /* ===== 语录 ===== */
  function currentQuote() {
    var idx = (typeof DATA.qidx === 'number') ? DATA.qidx : 0;
    if (idx < 0 || idx >= QUOTES.length) idx = 0;
    return { q: QUOTES[idx], idx: idx };
  }
  function renderQuote() {
    var c = currentQuote();
    $('quote-en').textContent = '"' + c.q.en + '"';
    $('quote-zh').textContent = c.q.zh;
  }
  function bindQuote() {
    /* 用事件委托：lucide 会把 <i> 替换成 <svg>，直接绑在元素上的监听器会丢失，
       委托到 document 上可避免此问题。 */
    document.addEventListener('click', function (e) {
      var refreshBtn = e.target.closest('#quote-refresh');
      if (refreshBtn) {
        var idx = (typeof DATA.qidx === 'number') ? DATA.qidx : 0;
        var nidx;
        if (QUOTES.length <= 1) { nidx = 0; }
        else { do { nidx = Math.floor(Math.random() * QUOTES.length); } while (nidx === idx); }
        DATA.qidx = nidx;
        saveData(DATA);
        renderQuote();
        return;
      }
      var speakBtn = e.target.closest('#quote-speak');
      if (speakBtn) {
        try {
          if (!window.speechSynthesis) return;
          var c = currentQuote();
          var u = new SpeechSynthesisUtterance(c.q.en);
          u.lang = 'en-US'; u.rate = 0.9;
          u.onend = function () { speakBtn.classList.remove('playing'); };
          u.onerror = function () { speakBtn.classList.remove('playing'); };
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
          speakBtn.classList.add('playing');
        } catch (err) {}
      }
    });
  }

  /* ===== 统计行（尝试读取其他页面数据） ===== */
  function readOther(page) {
    try { return JSON.parse(localStorage.getItem('tj_' + page + '_' + TODAY)) || {}; } catch (e) { return {}; }
  }
  function pickNum(obj, keys) {
    for (var i = 0; i < keys.length; i++) {
      if (typeof obj[keys[i]] === 'number' && !isNaN(obj[keys[i]])) return obj[keys[i]];
    }
    return null;
  }
  function renderStats() {
    /* 今日心情 */
    var moodEl = $('stat-mood');
    var moodData = readOther('mood');
    if (moodData && moodData.mood && moodData.mood.emoji) { moodEl.textContent = moodData.mood.emoji; }
    else { moodEl.textContent = '—'; }

    /* 今日花费（finance） */
    var f = readOther('finance');
    var spend = pickNum(f, ['spent', 'totalSpent', 'todaySpent', 'total', 'cost', 'expense']);
    if (spend === null && Array.isArray(f.records)) {
      var s = 0, has = false;
      f.records.forEach(function (r) { if (r && typeof r.amount === 'number') { s += r.amount; has = true; } });
      if (has && s > 0) spend = s;
    }
    $('stat-spend').innerHTML = (spend !== null) ? '¥' + Math.round(spend) : '—';

    /* 今日饮水（diet） */
    var di = readOther('diet');
    var water = pickNum(di, ['water', 'waterMl', 'waterIntake', 'drink']);
    $('stat-water').innerHTML = (water !== null) ? water + '<span class="stat-unit">ml</span>' : '—';

    /* 运动分钟（fitness） */
    var fit = readOther('fitness');
    var min = pickNum(fit, ['minutes', 'durationMin', 'minutesToday', 'exerciseMin', 'totalMin']);
    $('stat-fitness').innerHTML = (min !== null) ? min + '<span class="stat-unit">min</span>' : '—';
  }

  /* ===== 待办打卡 ===== */
  function renderTodos() {
    if (!Array.isArray(DATA.todos) || DATA.todos.length === 0) {
      DATA.todos = DEFAULT_TODOS.map(function (t) { return { text: t.text, done: false }; });
    }
    var grid = $('todo-grid');
    grid.innerHTML = '';
    DATA.todos.forEach(function (todo, i) {
      var pill = document.createElement('div');
      pill.className = 'todo-pill' + (todo.done ? ' done' : '');
      pill.dataset.idx = i;
      pill.innerHTML =
        '<div class="todo-check"><i data-lucide="check" style="width:12px;height:12px"></i></div>' +
        '<span class="todo-text">' + escapeHtml(todo.text) + '</span>' +
        '<i data-lucide="x" class="todo-del" style="width:12px;height:12px"></i>';
      pill.addEventListener('click', function (e) {
        if (e.target.closest('.todo-del')) return;
        var idx = parseInt(pill.dataset.idx, 10);
        if (!isNaN(idx)) { DATA.todos[idx].done = !DATA.todos[idx].done; saveData(DATA); renderTodos(); }
      });
      grid.appendChild(pill);
    });
    if (window.lucide) lucide.createIcons();
  }
  function bindTodos() {
    var input = $('todo-add-input');
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var v = input.value.trim();
        if (!v) return;
        if (!Array.isArray(DATA.todos)) DATA.todos = [];
        DATA.todos.push({ text: v, done: false });
        saveData(DATA);
        input.value = '';
        renderTodos();
      }
    });
    var grid = $('todo-grid');
    grid.addEventListener('click', function (e) {
      var del = e.target.closest('.todo-del');
      if (!del) return;
      e.stopPropagation();
      var pill = del.closest('.todo-pill');
      if (!pill) return;
      var idx = parseInt(pill.dataset.idx, 10);
      if (!isNaN(idx) && Array.isArray(DATA.todos)) {
        DATA.todos.splice(idx, 1);
        saveData(DATA);
        renderTodos();
      }
    });
  }

  /* ===== 初始化 ===== */
  document.addEventListener('DOMContentLoaded', function () {
    renderGreeting();
    bindMotto();
    renderQuote();
    bindQuote();
    renderStats();
    renderTodos();
    bindTodos();
    if (window.lucide) lucide.createIcons();
  });
})();
</script>
<script src="../assets/pwa-register.js"></script>
