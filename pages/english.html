      body:'Good health is built on small daily habits. Drink enough water, eat fresh vegetables, and sleep for seven to eight hours each night. Move your body regularly, even if it is just a short walk. These simple actions protect your energy and mood. Many people wait for motivation before they act, but motivation often comes after action. Start with one healthy habit and practice it every day. Soon it will become part of your normal life. Remember, your body is the home where you live your whole life. Take care of it with love and patience.'
    },
    {
      title:'The Gift of Kindness',
      body:'Kindness is a gift that costs nothing but means everything. A simple smile, a kind word, or a helping hand can brighten someone\'s day. When you are kind to others, you also feel happier yourself. Kindness creates trust and brings people closer together. It does not require a special occasion or a lot of money. You can practice kindness every day at home, at school, or at work. Treat others the way you want to be treated. The world becomes a warmer place when we choose kindness over anger. Start today, and make kindness your daily habit.'
    }
  ];

  function initDailyContent(){
    const baseSeed = parseInt(TODAY.replace(/-/g,''), 10) || 20250101;
    const basePassageIdx = new Date(TODAY + 'T00:00:00').getDate() % PASSAGES.length;

    if (!Number.isFinite(DATA.wordSeed)) DATA.wordSeed = baseSeed;
    if (!Number.isFinite(DATA.passageIdx)) DATA.passageIdx = basePassageIdx;
    if (!Array.isArray(DATA.wordSet) || DATA.wordSet.length === 0) {
      DATA.wordSet = pickWords(DATA.wordSeed);
    }
    if (typeof DATA.passageNote !== 'string') DATA.passageNote = '';
    if (typeof DATA.note !== 'string') DATA.note = '';
    saveData(DATA);
  }

  function seededRandom(seed){
    let s = (seed % 2147483647);
    if (s <= 0) s += 2147483646;
    return function(){
      s = (s * 16807) % 2147483647;
      return (s - 1) / 2147483646;
    };
  }

  function pickWords(seed, count){
    count = count || 10;
    const rand = seededRandom(seed);
    const pool = WORD_BANK.map(function(_, i){ return i; });
    const picked = [];
    for (let i = 0; i < count; i++) {
      const idx = Math.floor(rand() * pool.length);
      picked.push(WORD_BANK[pool[idx]]);
      pool.splice(idx, 1);
    }
    return picked.map(function(item){ return {word:item.word, meaning:item.meaning, example:item.example}; });
  }

  function regenerate(){
    DATA.wordSeed = Math.floor(Math.random() * 100000000);
    DATA.wordSet = pickWords(DATA.wordSeed);
    DATA.passageIdx = Math.floor(Math.random() * PASSAGES.length);
    saveData(DATA);
    renderAll();
    document.getElementById('passage-note').value = DATA.passageNote;
    updateStreak();
  }

  function esc(v){ return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function speak(text){
    if (!('speechSynthesis' in window)) return;
    if (!text || !String(text).trim()) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.9;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch(e){}
  }

  function dateKeyOffset(days){
    const d = new Date();
    d.setDate(d.getDate() - days);
    return 'tj_english_' + d.toISOString().slice(0,10);
  }

  function calcStreak(){
    let streak = 0;
    for (let i = 0; i < 400; i++) {
      const k = dateKeyOffset(i);
      if (localStorage.getItem(k) !== null) {
        streak++;
      } else if (i === 0) {
        continue;
      } else {
        break;
      }
    }
    return streak;
  }

  function updateStreak(){
    const n = calcStreak();
    const el = document.getElementById('streak-text');
    if (el) el.textContent = '连续 ' + n + ' 天';
    const badge = document.getElementById('streak-badge');
    if (badge) badge.style.opacity = n > 0 ? '1' : '0.6';
  }

  function renderDate(){
    const d = new Date();
    const w = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    const s = d.getFullYear() + '年' + String(d.getMonth()+1).padStart(2,'0') + '月' + String(d.getDate()).padStart(2,'0') + '日 ' + w;
    const pe = document.querySelector('.page-date');
    if (pe) pe.textContent = s;
    const sv = document.querySelector('.sidebar-footer .date-value');
    if (sv) sv.textContent = s;
  }

  function renderWords(){
    const box = document.getElementById('word-list');
    if (!DATA.wordSet || !DATA.wordSet.length) {
      box.innerHTML = '<div class="empty-state"><i data-lucide="book-open"></i>点击“换一组”生成今日单词</div>';
      return;
    }
    box.innerHTML = DATA.wordSet.map(function(w, i){
      return '<div class="word-row">' +
        '<div class="word-main">' +
          '<input class="field-input word-word" data-type="word" data-i="' + i + '" data-k="word" placeholder="单词" value="' + esc(w.word) + '">' +
          '<input class="field-input word-mean" data-type="word" data-i="' + i + '" data-k="meaning" placeholder="释义" value="' + esc(w.meaning) + '">' +
          '<button class="btn-read" data-read="' + i + '" title="朗读单词"><i data-lucide="volume-2"></i></button>' +
          '<button class="btn-del" data-del="word" data-i="' + i + '" title="删除"><i data-lucide="trash-2"></i></button>' +
        '</div>' +
        '<input class="field-input word-ex" data-type="word" data-i="' + i + '" data-k="example" placeholder="例句" value="' + esc(w.example) + '">' +
      '</div>';
    }).join('');
    const countBadge = document.getElementById('word-count');
    if (countBadge) countBadge.textContent = DATA.wordSet.length + ' 词';
  }

  function renderPassage(){
    const box = document.getElementById('passage-box');
    const idx = Number.isFinite(DATA.passageIdx) ? DATA.passageIdx : 0;
    const p = PASSAGES[idx] || PASSAGES[0];
    box.innerHTML = '<div class="passage-title">' + esc(p.title) + '</div>' +
      '<div class="passage-text">' + esc(p.body).replace(/\n/g,'<br>') + '</div>';
  }

  function renderAll(){
    renderWords();
    renderPassage();
    lucide.createIcons();
  }

  document.addEventListener('DOMContentLoaded', function(){
    initDailyContent();
    renderDate();
    renderAll();
    document.getElementById('passage-note').value = DATA.passageNote;
    document.getElementById('note-input').value = DATA.note;
    updateStreak();
  });

  document.addEventListener('input', function(ev){
    const t = ev.target;
    if (t.id === 'passage-note') {
      DATA.passageNote = t.value;
      saveData(DATA);
      updateStreak();
      return;
    }
    if (t.id === 'note-input') {
      DATA.note = t.value;
      saveData(DATA);
      updateStreak();
      return;
    }
    if (!t.dataset || t.dataset.type !== 'word') return;
    const i = +t.dataset.i;
    const k = t.dataset.k;
    if (!DATA.wordSet || !DATA.wordSet[i]) return;
    DATA.wordSet[i][k] = t.value;
    saveData(DATA);
    updateStreak();
  });

  document.addEventListener('click', function(ev){
    const del = ev.target.closest('[data-del]');
    if (del) {
      if (del.dataset.del !== 'word') return;
      const i = +del.dataset.i;
      if (DATA.wordSet && DATA.wordSet[i]) {
        DATA.wordSet.splice(i, 1);
        saveData(DATA);
        renderAll();
        updateStreak();
      }
      return;
    }
    const read = ev.target.closest('[data-read]');
    if (read) {
      const idx = +read.dataset.read;
      const w = DATA.wordSet && DATA.wordSet[idx];
      if (w) speak(w.word);
      return;
    }
  });

  document.getElementById('btn-refresh').addEventListener('click', regenerate);
  document.getElementById('btn-refresh-words').addEventListener('click', regenerate);

  document.getElementById('btn-read-passage').addEventListener('click', function(){
    const idx = Number.isFinite(DATA.passageIdx) ? DATA.passageIdx : 0;
    const p = PASSAGES[idx] || PASSAGES[0];
    speak(p.title + '. ' + p.body);
  });
})();
</script>
