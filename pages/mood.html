:root {
  /* ========== 是甜姐呀 — 多巴胺彩虹配色系统 V3 ========== */
  /* 赤橙黄绿青蓝紫 + 粉色多色阶 */

  /* 语义别名 —— apply-html-head-contract 需要 */
  --tianjie-background: var(--cream-50);
  --tianjie-foreground: var(--plum-900);
  --tianjie-card: #FFFFFF;
  --tianjie-card-foreground: var(--plum-900);
  --tianjie-popover: #FFFFFF;
  --tianjie-popover-foreground: var(--plum-900);
  --tianjie-primary: var(--pink-500);
  --tianjie-primary-foreground: #FFFFFF;
  --tianjie-muted: var(--pink-50);
  --tianjie-muted-foreground: var(--plum-500);
  --tianjie-border: var(--plum-100);
  --tianjie-input: var(--cream-100);
  --tianjie-ring: var(--pink-400);
  --tianjie-radius-sm: 6px;
  --tianjie-radius-md: 14px;
  --tianjie-radius-lg: 20px;

  /* 页面级快捷别名 */
  --bg: var(--tianjie-background);
  --foreground: var(--tianjie-foreground);
  --surface: var(--tianjie-card);
  --surface-2: var(--tianjie-muted);
  --ink: var(--plum-900);
  --ink-2: var(--plum-700);
  --ink-3: var(--plum-500);
  --line: var(--tianjie-border);
  --brand: var(--pink-500);
  --brand-soft: var(--pink-100);
  --brand-ink: #FFFFFF;
  --r-sm: var(--tianjie-radius-sm);
  --r-md: var(--tianjie-radius-md);
  --r-lg: var(--tianjie-radius-lg);
  --r-pill: 999px;
  --shadow-1: 0 2px 8px rgba(74, 63, 69, .05), 0 1px 3px rgba(74, 63, 69, .03);
  --shadow-2: 0 8px 24px -6px rgba(255, 107, 155, .18);
  --shadow-3: 0 18px 44px -12px rgba(74, 63, 69, .18);

  /* 侧边栏渐变 — 紫粉 */
  --sidebar-gradient: linear-gradient(180deg, var(--purple-500) 0%, var(--pink-300) 100%);

  /* 模块情绪色 — 赤橙黄绿青蓝紫粉 */
  --c-home: var(--purple-500);
  --c-diet: var(--green-500);
  --c-skincare: var(--pink-500);
  --c-fitness: var(--orange-500);
  --c-shaping: var(--cyan-500);
  --c-finance: var(--yellow-500);
  --c-stocks: var(--red-500);
  --c-english: var(--blue-500);
  --c-mood: var(--purple-500);

  /* 状态色 */
  --state-success: var(--green-500);
  --state-warning: var(--yellow-500);
  --state-error: #FF7A7A;
  --state-info: var(--blue-500);

  /* 字体 */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "MiSans", system-ui, sans-serif;
}

    <style id="critical-layout">
      *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);min-height:100vh;overscroll-behavior:none;-webkit-overflow-scrolling:touch}
      .app-frame{display:flex;width:100%;max-width:480px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
      .app-sidebar{width:80px;flex-shrink:0;background:linear-gradient(180deg,var(--purple-500) 0%,var(--pink-300) 100%);padding:14px 6px;display:flex;flex-direction:column;gap:10px}
      .sidebar-brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:8px}
      .brand-avatar{width:38px;height:38px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-1)}
      .brand-avatar svg{width:20px;height:20px;color:var(--pink-500)}
      .brand-title{font-size:12px;font-weight:700;color:#fff;text-align:center;word-break:keep-all}
      .brand-subtitle{font-size:10px;color:rgba(255,255,255,.85);text-align:center}
      .sidebar-nav{display:flex;flex-direction:column;gap:6px;flex:1}
      .nav-row{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:rgba(255,255,255,.92);text-decoration:none;transition:background .15s}
      .nav-row[data-active="true"]{background:rgba(255,255,255,.28);color:#fff;font-weight:600}
      .nav-icon{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:var(--module-color,var(--surface))}
      .nav-row[data-active="true"] .nav-icon{background:rgba(255,255,255,.45);color:var(--module-color,var(--surface))}
      .nav-icon svg{width:14px;height:14px}
      .nav-label{font-size:10px;line-height:1.1;text-align:center;word-break:keep-all;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .sidebar-footer{margin-top:auto}
      .date-card{background:rgba(255,255,255,.25);border-radius:12px;padding:8px 4px;color:#fff;text-align:center}
      .date-label{font-size:10px;opacity:.9}
      .date-value{font-size:10px;font-weight:600;margin-top:4px;line-height:1.3}
      .app-main{flex:1;padding:16px;overflow-y:auto}
      .page-header{margin-bottom:16px}
      .page-title{font-size:20px;font-weight:700;color:var(--ink);line-height:1.2}
      .page-date{font-size:13px;color:var(--ink-2);margin-top:4px}
      .card{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-1)}
      .card-title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:8px}
      .card-title .icon-dot{width:8px;height:8px;border-radius:50%;background:var(--module-color,var(--brand))}
      .module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
      .module-grid-4{grid-template-columns:repeat(4,1fr);gap:8px}
      .module-grid-4 .module-cell{padding:10px 6px;gap:5px;align-items:center;text-align:center}
      .module-grid-4 .module-cell .mod-icon{width:32px;height:32px;align-self:center}
      .module-grid-4 .module-cell .mod-icon svg{width:16px;height:16px}
      .module-grid-4 .module-cell .mod-name{font-size:11px;line-height:1.2}
      .module-grid-4 .module-cell .mod-hint{font-size:10px}
      .module-cell{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow-1);text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s}
      .module-cell:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
      .module-cell .mod-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--module-soft,var(--brand-soft));color:var(--module-color,var(--brand))}
      .module-cell .mod-icon svg{width:18px;height:18px}
      .module-cell .mod-name{font-size:13px;font-weight:600}
      .module-cell .mod-hint{font-size:11px;color:var(--ink-3)}
      .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
      .kpi-cell{text-align:center;padding:12px 8px;background:var(--surface-2);border-radius:var(--r-md)}
      .kpi-value{font-size:18px;font-weight:700;color:var(--ink)}
      .kpi-label{font-size:11px;color:var(--ink-2);margin-top:4px}
      .card-slim{padding:10px 14px}
      .overview-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
      .overview-title{font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;white-space:nowrap}
      .kpi-inline{display:flex;gap:6px;flex-wrap:wrap}
      .kpi-pill{display:inline-flex;align-items:baseline;gap:3px;padding:4px 9px;border-radius:var(--r-pill);background:var(--surface-2);font-size:11px;color:var(--ink-3)}
      .kpi-pill b{font-size:13px;font-weight:700}
      .kpi-pill i{font-style:normal}
      .hero-card{background:linear-gradient(135deg,var(--purple-500) 0%,var(--pink-400) 100%);padding:16px 18px;color:#fff;border:none}
      .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
      .hero-greeting{font-size:16px;font-weight:700;line-height:1.3}
      .hero-motto{font-size:12px;opacity:.9;margin-top:4px;line-height:1.3}
      .hero-weather{display:flex;align-items:center;gap:3px;font-size:12px;opacity:.95;flex-shrink:0;padding:5px 9px;background:rgba(255,255,255,.2);border-radius:var(--r-pill)}
      .hero-sync{display:flex;align-items:center;gap:4px;font-size:10px;opacity:.75;margin-top:10px}
      .quote-tag{display:inline-block;margin-top:5px;padding:1px 7px;border-radius:var(--r-pill);background:rgba(255,255,255,.5);font-size:9px;color:var(--plum-700);font-weight:500}
      .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
      .stat-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow-1);text-decoration:none;color:var(--ink);transition:transform .15s}
      .stat-card:hover{transform:translateY(-2px)}
      .stat-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--stat-soft);color:var(--stat-color)}
      .stat-icon svg{width:14px;height:14px}
      .stat-value{font-size:15px;font-weight:700;color:var(--stat-color);line-height:1.1}
      .stat-unit{font-size:9px;font-weight:500;margin-left:1px}
      .stat-label{font-size:10px;color:var(--ink-3)}
      .activity-list{display:flex;flex-direction:column;gap:0}
      .activity-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
      .activity-item:last-child{border-bottom:none;padding-bottom:0}
      .activity-item:first-child{padding-top:0}
      .activity-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
      .activity-icon svg{width:15px;height:15px}
      .activity-body{flex:1;min-width:0}
      .activity-text{font-size:13px;color:var(--ink);line-height:1.3}
      .activity-time{font-size:11px;color:var(--ink-3);margin-top:2px}
      .todo-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
      .todo-row:last-child{border-bottom:none;padding-bottom:0}
      .todo-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--surface)}
      .todo-row.done .todo-check{background:var(--green-500);border-color:var(--green-500);color:#fff}
      .todo-text{font-size:13px;color:var(--ink)}
      .todo-row.done .todo-text{color:var(--ink-3);text-decoration:line-through}
      .badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:var(--r-pill);font-size:11px;font-weight:500;background:var(--brand-soft);color:var(--brand)}
      .quote-card{background:linear-gradient(135deg,var(--purple-100) 0%,var(--pink-100) 100%);border:1px solid rgba(255,255,255,.6);padding:14px 16px}
      .quote-inline{display:flex;align-items:center;gap:12px}
      .quote-left{flex-shrink:0;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center}
      .quote-body{flex:1;min-width:0}
      .quote-en{font-size:13px;font-weight:600;color:var(--plum-900);line-height:1.4;font-style:italic}
      .quote-zh{font-size:11px;color:var(--plum-700);margin-top:3px;line-height:1.4}
      .quote-refresh{flex-shrink:0;cursor:pointer;opacity:.6}
      .todo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
      .todo-pill{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:var(--r-pill);background:var(--surface-2);font-size:12px;color:var(--ink)}
      .todo-pill.done{opacity:.6}
      .todo-pill .todo-check{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;flex-shrink:0}
      .todo-pill.done .todo-check{background:var(--green-500);border-color:var(--green-500);color:#fff}
    </style>
    <style>
      .mood-card .mood-subtitle{font-size:12px;color:var(--ink-3);margin-bottom:12px;margin-top:-4px}
      .mood-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
      .mood-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 4px;border-radius:var(--r-md);background:var(--surface-2);border:2px solid transparent;transition:transform .15s,border-color .15s,background .15s;cursor:pointer;font-family:inherit}
      .mood-btn:hover{transform:translateY(-1px)}
      .mood-btn.selected{border-color:var(--c-mood);background:var(--purple-100);transform:scale(1.03)}
      .mood-emoji{font-size:24px;line-height:1}
      .mood-name{font-size:11px;color:var(--ink-2)}
      .mood-btn.selected .mood-name{color:var(--c-mood);font-weight:600}
      .mood-note-wrap{margin-top:12px}
      .mood-note{width:100%;font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;resize:vertical;outline:none;transition:border-color .15s;min-height:70px}
      .mood-note:focus{border-color:var(--c-mood)}
      .history-list{display:flex;flex-direction:column;gap:0}
      .history-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
      .history-item:last-child{border-bottom:none;padding-bottom:0}
      .history-item:first-child{padding-top:0}
      .history-date{font-size:11px;color:var(--ink-3);width:70px;flex-shrink:0}
      .history-emoji{font-size:20px;flex-shrink:0}
      .history-note{flex:1;min-width:0;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .history-empty{padding:20px 8px}
      .back-home{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--c-mood);text-decoration:none}
      .back-home:hover{text-decoration:underline}
      .activity-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px 8px;text-align:center}
      .activity-empty-text{font-size:12px;color:var(--ink-3)}
    </style>
<script>
(function(){
  const TODAY = new Date().toISOString().slice(0,10);
  const KEY = 'tj_mood_' + TODAY;
  const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];

  function loadData(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function saveData(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
  let DATA = loadData();
  if(DATA.mood == null){ DATA.mood = null; }
  if(DATA.note == null){ DATA.note = ''; }

  function $(id){ return document.getElementById(id); }

  function renderDate(){
    const d = new Date();
    const s = d.getFullYear() + '年' + String(d.getMonth()+1).padStart(2,'0') + '月' + String(d.getDate()).padStart(2,'0') + '日 ' + WEEK[d.getDay()];
    const el = $('mood-hero-date');
    if(el) el.textContent = s;
    const sd = $('sidebar-date');
    if(sd) sd.textContent = s;
  }

  function renderMood(){
    document.querySelectorAll('.mood-btn').forEach(function(b){
      if(DATA.mood && b.dataset.mood === DATA.mood.mood){ b.classList.add('selected'); }
      else { b.classList.remove('selected'); }
    });
  }

  function bindMood(){
    const grid = $('mood-grid');
    grid.addEventListener('click', function(e){
      const b = e.target.closest('.mood-btn');
      if(!b) return;
      const mood = b.dataset.mood;
      if(DATA.mood && DATA.mood.mood === mood){
        DATA.mood = null;
      } else {
        DATA.mood = { mood: mood, emoji: b.dataset.emoji, name: b.querySelector('.mood-name').textContent };
      }
      saveData(DATA);
      renderMood();
      renderHistory();
    });
    const note = $('mood-note');
    note.value = DATA.note || '';
    note.addEventListener('input', function(){
      DATA.note = note.value;
      saveData(DATA);
      renderHistory();
    });
  }

  function dateKey(offset){
    const d = new Date();
    d.setDate(d.getDate() - offset);
    return 'tj_mood_' + d.toISOString().slice(0,10);
  }

  function fmtDateShort(iso){
    const d = new Date(iso);
    return (d.getMonth()+1) + '/' + d.getDate() + ' ' + WEEK[d.getDay()];
  }

  function renderHistory(){
    const box = $('history-list');
    const items = [];
    for(let i = 0; i < 7; i++){
      const k = dateKey(i);
      const raw = localStorage.getItem(k);
      if(!raw) continue;
      try{
        const obj = JSON.parse(raw);
        if(!obj || (!obj.mood && !(obj.note || '').trim())) continue;
        const iso = k.replace('tj_mood_', '');
        items.push({
          date: fmtDateShort(iso),
          emoji: obj.mood ? obj.mood.emoji : '·',
          note: (obj.note || '').trim().slice(0, 20) || (obj.mood ? obj.mood.name : '')
        });
      }catch(e){}
    }
    if(!items.length){
      box.innerHTML = '<div class="activity-empty"><i data-lucide="history" style="width:28px;height:28px;color:var(--ink-3)"></i><div class="activity-empty-text">过去 7 天还没有心情记录</div></div>';
    } else {
      box.innerHTML = items.map(function(it){
        return '<div class="history-item">' +
          '<span class="history-date">' + it.date + '</span>' +
          '<span class="history-emoji">' + it.emoji + '</span>' +
          '<span class="history-note">' + (it.note || '') + '</span>' +
        '</div>';
      }).join('');
    }
    if(window.lucide) lucide.createIcons();
  }

  document.addEventListener('DOMContentLoaded', function(){
    renderDate();
    renderMood();
    bindMood();
    renderHistory();
    if(window.lucide) lucide.createIcons();
  });
})();
</script>
<script src="../assets/pwa-register.js"></script>
</body>
</html>
