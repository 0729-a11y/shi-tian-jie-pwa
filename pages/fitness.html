    <style id="theme-vars">
:root {
  /* ========== 是甜姐呀 — 多巴胺彩虹配色系统 V3 ========== */
  /* 赤橙黄绿青蓝紫 + 粉色多色阶 */

  /* 粉色 — 6 色阶（品种更丰富） */
  --pink-600: #FF4F88;

  --purple-500: #A78BFA;
  --purple-300: #C4B5FD;
  --purple-100: #EDE9FE;

  /* 彩虹色系 — 赤橙黄绿青蓝 */
  --red-500: #FF6B6B;
  --red-100: #FFE3E3;
  --orange-500: #FF9F43;
  --orange-100: #FFE8D1;
  --yellow-500: #FFD166;

  --yellow-300: #FFE3A3;
  --yellow-100: #FFF2D1;
  --yellow-50: #FFF9E8;
  --green-500: #66D2A0;
  --green-400: #85DDB4;
  --green-300: #A5E8C8;
  --green-100: #DDF7EA;
  --green-50: #EEFBF5;
  --cyan-500: #4ECDC4;
  --cyan-100: #D1F5F2;
  --blue-500: #5B9BD5;
  --blue-100: #D9EBF7;

  --cream-50: #FFFBFC;
  --cream-100: #FFF5F8;
  --plum-900: #4A3F45;
  --plum-700: #6B5E65;
  --plum-500: #9E9197;
  --plum-300: #D3C9CE;
  --plum-100: #F2ECEE;

  /* 语义别名 —— apply-html-head-contract 需要 */
  --tianjie-background: var(--cream-50);
  --tianjie-foreground: var(--plum-900);
  --tianjie-card: #FFFFFF;
  --tianjie-card-foreground: var(--plum-900);
  --tianjie-popover: #FFFFFF;
  --tianjie-popover-foreground: var(--plum-900);
  --tianjie-primary: var(--pink-500);
  --tianjie-primary-foreground: #FFFFFF;
  --tianjie-muted: var(--pink-50);
  --tianjie-muted-foreground: var(--plum-500);
  --tianjie-border: var(--plum-100);
  --tianjie-input: var(--cream-100);
  --tianjie-ring: var(--pink-400);
  --tianjie-radius-sm: 6px;
  --tianjie-radius-md: 14px;
  --tianjie-radius-lg: 20px;

  /* 页面级快捷别名 */
  --bg: var(--tianjie-background);
  --foreground: var(--tianjie-foreground);
  --surface: var(--tianjie-card);
  --surface-2: var(--tianjie-muted);
  --ink: var(--plum-900);
  --ink-2: var(--plum-700);
  --ink-3: var(--plum-500);
  --line: var(--tianjie-border);
  --brand: var(--pink-500);
  --brand-soft: var(--pink-100);
  --brand-ink: #FFFFFF;
  --r-sm: var(--tianjie-radius-sm);
  --r-md: var(--tianjie-radius-md);
  --r-lg: var(--tianjie-radius-lg);
  --r-pill: 999px;
  --shadow-1: 0 2px 8px rgba(74, 63, 69, .05), 0 1px 3px rgba(74, 63, 69, .03);
  --shadow-2: 0 8px 24px -6px rgba(255, 107, 155, .18);
  --shadow-3: 0 18px 44px -12px rgba(74, 63, 69, .18);

  /* 侧边栏渐变 — 紫粉 */
  --sidebar-gradient: linear-gradient(180deg, var(--purple-500) 0%, var(--pink-300) 100%);

  /* 模块情绪色 — 赤橙黄绿青蓝紫粉 */
  --c-home: var(--purple-500);
  --c-diet: var(--green-500);
  --c-skincare: var(--pink-500);
  --c-fitness: var(--orange-500);
  --c-shaping: var(--cyan-500);
  --c-finance: var(--yellow-500);
  --c-stocks: var(--red-500);
  --c-english: var(--blue-500);
  --c-mood: var(--purple-500);

  /* 状态色 */
  --state-success: var(--green-500);
  --state-warning: var(--yellow-500);
  --state-error: #FF7A7A;
  --state-info: var(--blue-500);

  /* 字体 */
  --font-sans: "Inter", "Noto Sans SC", "PingFang SC", "MiSans", system-ui, sans-serif;
}

    <style id="critical-layout">
      *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);min-height:100vh;overscroll-behavior:none;-webkit-overflow-scrolling:touch}
      .app-frame{display:flex;width:100%;max-width:480px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
      .app-sidebar{width:80px;flex-shrink:0;background:linear-gradient(180deg,var(--purple-500) 0%,var(--pink-300) 100%);padding:14px 6px;display:flex;flex-direction:column;gap:10px}
      .sidebar-brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:8px}
      .brand-avatar{width:38px;height:38px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-1)}
      .brand-avatar svg{width:20px;height:20px;color:var(--pink-500)}
      .brand-title{font-size:12px;font-weight:700;color:#fff;text-align:center;word-break:keep-all}
      .brand-subtitle{font-size:10px;color:rgba(255,255,255,.85);text-align:center}
      .sidebar-nav{display:flex;flex-direction:column;gap:6px;flex:1}
      .nav-row{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:rgba(255,255,255,.92);text-decoration:none;transition:background .15s}
      .nav-row[data-active="true"]{background:rgba(255,255,255,.28);color:#fff;font-weight:600}
      .nav-icon{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;color:var(--module-color,var(--surface))}
      .nav-row[data-active="true"] .nav-icon{background:rgba(255,255,255,.45);color:var(--module-color,var(--surface))}
      .nav-icon svg{width:14px;height:14px}
      .nav-label{font-size:10px;line-height:1.1;text-align:center;word-break:keep-all;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .sidebar-footer{margin-top:auto}
      .date-card{background:rgba(255,255,255,.25);border-radius:12px;padding:8px 4px;color:#fff;text-align:center}
      .date-label{font-size:10px;opacity:.9}
      .date-value{font-size:10px;font-weight:600;margin-top:4px;line-height:1.3}
      .app-main{flex:1;padding:16px;overflow-y:auto}
      .page-header{margin-bottom:16px}
      .page-title{font-size:20px;font-weight:700;color:var(--ink);line-height:1.2}
      .page-date{font-size:13px;color:var(--ink-2);margin-top:4px}
      .card{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-1)}
      .card-title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:8px}
      .card-title .icon-dot{width:8px;height:8px;border-radius:50%;background:var(--module-color,var(--brand))}
      .module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
      .module-cell{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow-1);text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s}
      .module-cell:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
      .module-cell .mod-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--module-soft,var(--brand-soft));color:var(--module-color,var(--brand))}
      .module-cell .mod-icon svg{width:18px;height:18px}
      .module-cell .mod-name{font-size:13px;font-weight:600}
      .module-cell .mod-hint{font-size:11px;color:var(--ink-3)}
      .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
      .kpi-cell{text-align:center;padding:12px 8px;background:var(--surface-2);border-radius:var(--r-md)}
      .kpi-value{font-size:18px;font-weight:700;color:var(--ink)}
      .kpi-label{font-size:11px;color:var(--ink-2);margin-top:4px}
      .todo-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
      .todo-row:last-child{border-bottom:none;padding-bottom:0}
      .todo-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--surface)}
      .todo-row.done .todo-check{background:var(--green-500);border-color:var(--green-500);color:#fff}
      .todo-text{font-size:13px;color:var(--ink)}
      .todo-row.done .todo-text{color:var(--ink-3);text-decoration:line-through}
      .badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:var(--r-pill);font-size:11px;font-weight:500;background:var(--brand-soft);color:var(--brand)}
      .exercise-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
      .exercise-item:last-child{border-bottom:none;padding-bottom:0}
      .exercise-name{font-size:13px;color:var(--ink);display:flex;align-items:center;gap:6px}
      .exercise-name svg{width:14px;height:14px;color:var(--c-fitness)}
      .exercise-meta{font-size:12px;color:var(--ink-3)}
      .btn-primary{width:100%;margin-top:12px;padding:10px;border-radius:var(--r-md);border:none;background:var(--module-color,var(--brand));color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
      .btn-primary svg{width:16px;height:16px}
    </style>
    <style>
      .log-head{display:flex;align-items:center;gap:8px;padding:0 0 6px;border-bottom:1px solid var(--line);font-size:11px;color:var(--ink-3);font-weight:600}
      .lh-type{flex:1}
      .lh-dur{width:64px;text-align:center}
      .lh-kcal{width:72px;text-align:center}
      .lh-op{width:30px;text-align:center}
      .log-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
      .log-row:last-child{border-bottom:none}
      .log-type{flex:1;border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;font-size:13px;color:var(--ink);background:var(--surface);font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
      .log-dur{width:64px;text-align:center;border:1px solid var(--line);border-radius:var(--r-md);padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
      .log-kcal{width:72px;text-align:center;border:1px solid var(--line);border-radius:var(--r-md);padding:8px 4px;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
      .log-type:focus,.log-dur:focus,.log-kcal:focus{border-color:var(--c-fitness);box-shadow:0 0 0 3px var(--orange-100)}
      .row-del{flex-shrink:0;width:30px;height:30px;border:none;background:var(--red-100);color:var(--red-500);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
      .row-del:hover{background:var(--red-500);color:#fff}
      .row-del svg{width:14px;height:14px}
      .empty-state{text-align:center;padding:16px 8px;font-size:12px;color:var(--ink-3)}
      .btn-add{width:100%;margin-top:10px;padding:9px;border:1.5px dashed var(--c-fitness);border-radius:var(--r-md);background:var(--orange-100);color:var(--c-fitness);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:inherit;transition:background .15s}
      .btn-add:hover{background:var(--orange-500);color:#fff}
      .btn-add svg{width:14px;height:14px}
      .goal-wrap{display:flex;flex-direction:column;gap:10px}
      .goal-label{font-size:12px;color:var(--ink-2)}
      .goal-input-row{display:flex;align-items:center;gap:10px}
      .goal-input{flex:1;text-align:center;font-size:22px;font-weight:700;color:var(--c-fitness);border:1px solid var(--line);border-radius:var(--r-md);padding:8px;background:var(--surface);font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
      .goal-input:focus{border-color:var(--c-fitness);box-shadow:0 0 0 3px var(--orange-100)}
      .goal-unit{font-size:14px;font-weight:600;color:var(--ink-2)}
      .goal-progress{margin-top:4px}
      .progress-text{font-size:12px;color:var(--ink-2);margin-bottom:6px}
      .progress-wrap{background:var(--surface-2);border-radius:var(--r-pill);height:10px;overflow:hidden}
      .progress-bar{height:100%;background:linear-gradient(90deg,var(--c-fitness),var(--yellow-500));border-radius:var(--r-pill);transition:width .3s}
    </style>
    <script>
    (function(){
      const TODAY = new Date().toISOString().slice(0,10);
      const KEY = 'tj_fitness_' + TODAY;
      function loadData(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
      function saveData(d){ localStorage.setItem(KEY, JSON.stringify(d)); }
      let DATA = loadData();
      if(!Array.isArray(DATA.logs)){ DATA.logs = []; }
      if(DATA.goal == null){ DATA.goal = 30; }
      saveData(DATA);

      function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
      function num(v){ const n = Number(v); return isNaN(n) ? 0 : n; }
      function totalDur(){ return DATA.logs.reduce(function(s,r){ return s + num(r.duration); }, 0); }
      function totalKcal(){ return DATA.logs.reduce(function(s,r){ return s + num(r.kcal); }, 0); }

      function renderKPI(){
        document.getElementById('kpi-duration').textContent = totalDur();
        document.getElementById('kpi-kcal').textContent = totalKcal();
        document.getElementById('kpi-count').textContent = DATA.logs.length;
        const goal = num(DATA.goal);
        const done = totalDur();
        document.getElementById('goal-done').textContent = done;
        document.getElementById('goal-target').textContent = goal;
        const pct = goal > 0 ? Math.min(100, Math.round(done / goal * 100)) : 0;
        document.getElementById('goal-bar').style.width = pct + '%';
      }

      function renderLogs(){
        const list = document.getElementById('log-list');
        if(!DATA.logs.length){ list.innerHTML = '<div class="empty-state">今天还没有运动记录，点击下方“添加记录”</div>'; return; }
        list.innerHTML = '';
        DATA.logs.forEach(function(item, idx){
          const row = document.createElement('div');
          row.className = 'log-row';
          row.innerHTML =
            '<input class="log-type" type="text" placeholder="如 跑步/瑜伽/力量" value="' + esc(item.type) + '">' +
            '<input class="log-dur" type="number" inputmode="numeric" placeholder="0" value="' + (item.duration != null && item.duration !== '' ? esc(item.duration) : '') + '">' +
            '<input class="log-kcal" type="number" inputmode="numeric" placeholder="0" value="' + (item.kcal != null && item.kcal !== '' ? esc(item.kcal) : '') + '">' +
            '<button class="row-del" type="button" aria-label="删除"><i data-lucide="trash-2"></i></button>';
          const typeInput = row.querySelector('.log-type');
          const durInput = row.querySelector('.log-dur');
          const kcalInput = row.querySelector('.log-kcal');
          typeInput.addEventListener('input', function(){ DATA.logs[idx].type = typeInput.value; saveData(DATA); });
          durInput.addEventListener('input', function(){ DATA.logs[idx].duration = durInput.value; saveData(DATA); renderKPI(); });
          kcalInput.addEventListener('input', function(){ DATA.logs[idx].kcal = kcalInput.value; saveData(DATA); renderKPI(); });
          row.querySelector('.row-del').addEventListener('click', function(){ DATA.logs.splice(idx,1); saveData(DATA); renderLogs(); renderKPI(); });
          list.appendChild(row);
        });
        lucide.createIcons();
      }

      function addLog(){ DATA.logs.push({type:'', duration:'', kcal:''}); saveData(DATA); renderLogs(); renderKPI(); }
      document.getElementById('btn-add-log').addEventListener('click', addLog);

      const goalInput = document.getElementById('input-goal');
      goalInput.value = DATA.goal || '';
      goalInput.addEventListener('input', function(){ DATA.goal = goalInput.value; saveData(DATA); renderKPI(); });

      renderLogs();
      renderKPI();

      function fmtDate(){
        const d = new Date();
        const y = d.getFullYear(), mo = String(d.getMonth()+1).padStart(2,'0'), da = String(d.getDate()).padStart(2,'0');
        const w = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
        return y + '年' + mo + '月' + da + '日 ' + w;
      }
      document.getElementById('date-text').textContent = fmtDate();
      const sd = document.getElementById('sidebar-date'); if(sd) sd.textContent = fmtDate();

      lucide.createIcons();
    })();
    </script>
<script src="../assets/pwa-register.js"></script>
</body>
</html>
