<script>
(function(){
  var TODAY = new Date().toISOString().slice(0,10);
  var KEY = 'tj_stocks_' + TODAY;
  function loadData(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function saveData(d){ localStorage.setItem(KEY, JSON.stringify(d)); }
  var DATA = loadData();
  DATA.watchlist = Array.isArray(DATA.watchlist) ? DATA.watchlist : [];
  DATA.note = typeof DATA.note === 'string' ? DATA.note : '';

  function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }

  /* ========== 大盘实时行情（腾讯财经） ========== */
  var INDEX_MAP = {
    'sh000001': {key:'sh', name:'上证指数'},
    'sz399001': {key:'sz', name:'深证成指'},
    'sz399006': {key:'cy', name:'创业板指'}
  };
  var INDEX_CODES = Object.keys(INDEX_MAP).join(',');
  var POLL_INTERVAL = 5000;
  var pollTimer = null;

  function fmtIndex(n, digits){
    if(n == null || isNaN(n)) return '—';
    return (+n).toFixed(digits);
  }

  function setIndexColor(el, n){
    el.classList.remove('up','down');
    if(n > 0) el.classList.add('up');
    else if(n < 0) el.classList.add('down');
  }

  function parseIndexData(){
    for(var code in INDEX_MAP){
      var info = INDEX_MAP[code];
      var str = window['v_' + code];
      var elVal = document.getElementById('idx-' + info.key);
      var elChg = document.getElementById('idx-' + info.key + '-change');
      var elAmt = document.getElementById('idx-' + info.key + '-amount');
      if(!str || !elVal || !elChg || !elAmt) continue;
      var parts = String(str).split('~');
      if(parts.length < 35) continue;
      var point = parseFloat(parts[3]);
      var amount = parseFloat(parts[31]);
      var pct = parseFloat(parts[32]);
      elVal.textContent = fmtIndex(point, 2);
      elChg.textContent = (pct >= 0 ? '+' : '') + fmtIndex(pct, 2) + '%';
      elAmt.textContent = (amount >= 0 ? '+' : '') + fmtIndex(amount, 2);
      setIndexColor(elChg, pct);
      setIndexColor(elAmt, amount);
    }
  }

  function loadIndexScript(){
    var s = document.createElement('script');
    s.src = 'https://qt.gtimg.cn/q=' + INDEX_CODES + '&_=' + Date.now();
    s.async = true;
    s.onload = function(){
      parseIndexData();
      if(s.parentNode) s.parentNode.removeChild(s);
    };
    s.onerror = function(){
      if(s.parentNode) s.parentNode.removeChild(s);
    };
    document.head.appendChild(s);
  }

  function startIndexPoll(){
    loadIndexScript();
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(loadIndexScript, POLL_INTERVAL);
  }

  function renderDate(){
    var d = new Date();
    var w = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
    var s = d.getFullYear()+'年'+String(d.getMonth()+1).padStart(2,'0')+'月'+String(d.getDate()).padStart(2,'0')+'日 '+w;
    var pe = document.querySelector('.page-date'); if(pe) pe.textContent = s;
    var sv = document.querySelector('.sidebar-footer .date-value'); if(sv) sv.textContent = s;
  }

  function updatePnl(i){
    var s = DATA.watchlist[i]; if(!s) return;
    var el = document.querySelector('[data-pnl="'+i+'"]'); if(!el) return;
    var buy = num(s.buy), now = num(s.now);
    if(!buy || buy === 0 || !now){
      el.textContent = '—';
      el.className = 'stock-pnl';
      return;
    }
    var pct = (now - buy) / buy * 100;
    el.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
    el.className = 'stock-pnl ' + (pct >= 0 ? 'up' : 'down');
  }

  function renderWatch(){
    var box = document.getElementById('watch-list');
    if(!DATA.watchlist.length){
      box.innerHTML = '<div class="empty-state"><i data-lucide="line-chart"></i>还没有添加自选股</div>';
      return;
    }
    box.innerHTML = DATA.watchlist.map(function(s,i){
      return '<div class="stock-row">' +
        '<div class="stock-main">' +
          '<input class="field-input" data-type="watch" data-i="'+i+'" data-k="code" placeholder="代码" value="'+esc(s.code)+'">' +
          '<input class="field-input" data-type="watch" data-i="'+i+'" data-k="name" placeholder="名称" value="'+esc(s.name)+'">' +
          '<button class="btn-del" data-del="watch" data-i="'+i+'" title="删除"><i data-lucide="trash-2"></i></button>' +
        '</div>' +
        '<div class="stock-sub">' +
          '<input class="field-input field-price" data-type="watch" data-i="'+i+'" data-k="buy" type="number" inputmode="decimal" placeholder="买入价" value="'+esc(s.buy)+'">' +
          '<input class="field-input field-price" data-type="watch" data-i="'+i+'" data-k="now" type="number" inputmode="decimal" placeholder="现价" value="'+esc(s.now)+'">' +
          '<span class="stock-pnl" data-pnl="'+i+'">—</span>' +
        '</div>' +
      '</div>';
    }).join('');
    for(var i=0;i<DATA.watchlist.length;i++){ updatePnl(i); }
  }

  function renderAll(){
    renderWatch();
    lucide.createIcons();
  }

  function focusNewRow(){
    var el = document.querySelector('#watch-list .stock-row:last-child .field-input');
    if(el){ try{ el.focus(); }catch(e){} }
  }

  document.addEventListener('input', function(ev){
    var t = ev.target;
    if(t.id === 'stock-note'){
      DATA.note = t.value;
      saveData(DATA);
      return;
    }
    if(!t.dataset || t.dataset.type !== 'watch') return;
    var i = +t.dataset.i, k = t.dataset.k;
    if(!DATA.watchlist[i]) return;
    DATA.watchlist[i][k] = t.value;
    saveData(DATA);
    if(k === 'buy' || k === 'now'){ updatePnl(i); }
  });

  document.addEventListener('keydown', function(ev){
    if(ev.key !== 'Enter') return;
    var t = ev.target;
    if(!t.classList || !t.classList.contains('field-input')) return;
    if(t.dataset && t.dataset.type === 'watch'){
      ev.preventDefault();
      DATA.watchlist.push({code:'',name:'',buy:'',now:''});
      saveData(DATA);
      renderWatch();
      lucide.createIcons();
      focusNewRow();
    }
  });

  document.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-del]');
    if(!b) return;
    if(b.dataset.del !== 'watch') return;
    var i = +b.dataset.i;
    DATA.watchlist.splice(i,1);
    saveData(DATA);
    renderAll();
  });

  document.getElementById('btn-add-stock').addEventListener('click', function(){
    DATA.watchlist.push({code:'',name:'',buy:'',now:''});
    saveData(DATA);
    renderWatch();
    lucide.createIcons();
    focusNewRow();
  });

  renderDate();
  document.getElementById('stock-note').value = DATA.note;
  startIndexPoll();
  renderAll();
  lucide.createIcons();
})();
</script>
